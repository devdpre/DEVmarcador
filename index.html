<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>WebAR - Modelo GLB con Marcador Personalizado</title>
    
    <!-- Importamos A-Frame -->
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    
    <!-- Importamos AR.js para A-Frame con soporte NFT (Image Tracking) -->
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar-nft.js"></script>
    
    <!-- Opcional: A-Frame Extras para reproducir animaciones si el modelo GLB las tiene -->
    <script src="https://cdn.jsdelivr.net/gh/c-base/aframe-extras@7.0.0/dist/aframe-extras.min.js"></script>

    <style>
        body {
            margin: 0;
            overflow: hidden;
            font-family: sans-serif;
        }
        
        /* Un pequeño overlay para mostrar mensajes o instrucciones (opcional) */
        #ui-container {
            position: absolute;
            top: 10px;
            left: 10px;
            z-index: 10;
            color: white;
            background: rgba(0,0,0,0.7);
            padding: 10px;
            border-radius: 5px;
            pointer-events: none; /* Para no interferir con toques en la pantalla */
        }
    </style>
</head>
<body>

    <div id="ui-container">
        <h3>Experiencia AR</h3>
        <p>Apunta la cámara al <b>logoDEV original</b> (sin marco).</p>
        <p style="font-size: 13px; color: #ffeb3b;">Cargando rastreador...<br>Puede tardar unos segundos la primera vez.</p>
    </div>

    <!-- 
      Configuramos la escena de A-Frame para Image Tracking (NFT).
    -->
    <a-scene 
        embedded 
        arjs="trackingMethod: best; sourceType: webcam; debugUIEnabled: false;"
        renderer="logarithmicDepthBuffer: true; colorManagement: true;"
        vr-mode-ui="enabled: false">
        
        <a-assets>
            <a-asset-item id="modeloEscudo" src="escudo.glb"></a-asset-item>
        </a-assets>

        <!-- 
          Configuramos el marcador NFT.
          url: la ruta a los archivos generados (SIN extensión).
          Asegúrate de que los archivos estén junto al index.html
        -->
        <a-nft
            type="nft"
            url="logoDEV"
            smooth="true"
            smoothCount="10"
            smoothTolerance=".01"
            smoothThreshold="5">
            
            <!-- 
              Caja de diagnóstico.
              NOTA SOBRE LA ESCALA: En Image Tracking (NFT) la escala requerida
              suele ser 50 o 100 veces MÁS GRANDE que en marcadores normales.
            -->
            <a-box position="0 0 0" scale="100 100 100" color="red" opacity="0"></a-box>

            <!-- Tu Modelo GLB -->
            <a-entity 
                gltf-model="#modeloEscudo" 
                position="0 0 0" 
                scale="100 100 100" 
                rotation="-90 0 0"
                animation-mixer>
            </a-entity>
            
        </a-nft>
